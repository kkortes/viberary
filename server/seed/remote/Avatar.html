<avatar-disc sm="@[sm]" style="--x: @[x]; --y: @[y]; --zoom: @[zoom || 5]">
  <img src="@[image]" alt="@[name || '']" />
</avatar-disc>

<style>
  avatar-disc {
    position: relative;
    display: block;
    width: calc(var(--unit) * 32);
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    background: var(--card);
    box-shadow:
      inset 0 0 0 calc(var(--unit) * 0.75) rgb(255 255 255 / 0.25),
      inset 0 0 0 1px rgb(0 0 0 / 0.5),
      0 calc(var(--unit) * 1.5) calc(var(--unit) * 3) calc(var(--unit) * -0.5) rgb(0 0 0 / 0.25);
    transform: rotate(calc(-1 * var(--rot, 0deg)));
    transition:
      transform 160ms cubic-bezier(0.34, 1.45, 0.6, 1),
      box-shadow 160ms ease,
      filter 250ms ease,
      opacity 250ms ease;
  }

  avatar-disc img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(100% * var(--zoom));
    transform: translate(calc(var(--x, 50) * -1%), calc(var(--y, 15) * -1%));
    pointer-events: none;
  }

  avatar-disc[sm] {
    width: calc(var(--unit) * 12);
  }
</style>
