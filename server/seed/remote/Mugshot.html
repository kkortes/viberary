<mugshot mirror="@[mirror]" style="--mug-x: @[x]; --mug-y: @[y]; --mug-zoom: @[zoom || 1.6]">
  <img src="@[image]" alt="@[name || '']" mugshot-img />
</mugshot>

<style>
  mugshot {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  mugshot[mirror] {
    transform: scaleX(-1);
  }

  mugshot [mugshot-img] {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(100% * var(--mug-zoom));
    height: auto;
    transform: translate(calc(var(--mug-x, 50) * -1%), calc(var(--mug-y, 15) * -1%));
    pointer-events: none;
  }
</style>
